<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | محلك - شي إن</title>
  <meta name="description" content="سجل دخولك لإدارة متجرك وأتمتة عملياتك">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/styles.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            border: 'hsl(var(--border))',
            background: 'hsl(var(--background))',
            foreground: 'hsl(var(--foreground))',
            primary: { DEFAULT: 'hsl(var(--primary))', foreground: 'hsl(var(--primary-foreground))' },
            secondary: { DEFAULT: 'hsl(var(--secondary))', foreground: 'hsl(var(--secondary-foreground))' },
            muted: { DEFAULT: 'hsl(var(--muted))', foreground: 'hsl(var(--muted-foreground))' },
            accent: { DEFAULT: 'hsl(var(--accent))', foreground: 'hsl(var(--accent-foreground))' },
            card: { DEFAULT: 'hsl(var(--card))', foreground: 'hsl(var(--card-foreground))' },
            destructive: { DEFAULT: 'hsl(var(--destructive))', foreground: 'hsl(var(--destructive-foreground))' },
          },
        },
      },
    }
  </script>
</head>
<body class="min-h-screen bg-gradient-hero">
  
  <div class="min-h-screen flex">
    <!-- Left Side - Form -->
    <div class="flex-1 flex items-center justify-center p-8">
      <div class="w-full max-w-md">
        <!-- Logo -->
        <a href="/" class="inline-block mb-8">
          <img src="/assets/logo.png" alt="محلك - شي إن" class="h-12 w-auto">
        </a>

        <!-- Header -->
        <div class="mb-8">
          <h1 class="text-3xl font-bold mb-2">مرحباً بعودتك! 👋</h1>
          <p class="text-muted-foreground">سجل دخولك للوصول إلى لوحة التحكم</p>
        </div>

        <!-- Form -->
        <form class="space-y-6">
          <div>
            <label class="block text-sm font-medium mb-2" for="email">البريد الإلكتروني</label>
            <div class="relative">
              <input 
                type="email" 
                id="email" 
                class="w-full px-4 py-3 pr-12 rounded-xl border border-border bg-card focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all"
                placeholder="example@email.com"
                required
              >
              <i data-lucide="mail" class="w-5 h-5 absolute top-1/2 right-4 -translate-y-1/2 text-muted-foreground"></i>
            </div>
          </div>

          <div>
            <div class="flex items-center justify-between mb-2">
              <label class="block text-sm font-medium" for="password">كلمة المرور</label>
              <a href="#" class="text-sm text-primary hover:underline">نسيت كلمة المرور؟</a>
            </div>
            <div class="relative">
              <input 
                type="password" 
                id="password" 
                class="w-full px-4 py-3 pr-12 rounded-xl border border-border bg-card focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all"
                placeholder="••••••••"
                required
              >
              <i data-lucide="lock" class="w-5 h-5 absolute top-1/2 right-4 -translate-y-1/2 text-muted-foreground"></i>
            </div>
          </div>

          <div class="flex items-center gap-2">
            <input type="checkbox" id="remember" class="w-4 h-4 rounded border-border text-primary focus:ring-primary">
            <label for="remember" class="text-sm text-muted-foreground">تذكرني</label>
          </div>

          <button type="submit" class="btn-hero w-full">
            تسجيل الدخول
            <i data-lucide="arrow-left" class="w-5 h-5"></i>
          </button>
        </form>

        <!-- Divider -->
        <div class="flex items-center gap-4 my-8">
          <div class="flex-1 h-px bg-border"></div>
          <span class="text-sm text-muted-foreground">أو</span>
          <div class="flex-1 h-px bg-border"></div>
        </div>

        <!-- Social Login -->
        <div class="space-y-3">
          <button class="w-full flex items-center justify-center gap-3 px-4 py-3 rounded-xl border border-border hover:bg-muted transition-colors">
            <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            <span>الدخول بحساب Google</span>
          </button>
        </div>

        <!-- Register Link -->
        <p class="text-center mt-8 text-muted-foreground">
          ليس لديك حساب؟ 
          <a href="/register.html" class="text-primary font-medium hover:underline">أنشئ حساباً جديداً</a>
        </p>
      </div>
    </div>

    <!-- Right Side - Visual -->
    <div class="hidden lg:flex flex-1 items-center justify-center bg-gradient-primary p-12 relative overflow-hidden">
      <div class="absolute inset-0 opacity-30">
        <div class="absolute top-20 right-20 w-72 h-72 bg-accent/30 rounded-full blur-3xl"></div>
        <div class="absolute bottom-20 left-20 w-96 h-96 bg-white/10 rounded-full blur-3xl"></div>
      </div>
      
      <div class="relative z-10 text-white text-center max-w-lg">
        <div class="w-20 h-20 rounded-2xl bg-white/10 flex items-center justify-center mx-auto mb-8">
          <i data-lucide="store" class="w-10 h-10"></i>
        </div>
        <h2 class="text-3xl font-bold mb-4">أدر متجرك بذكاء</h2>
        <p class="text-white/80 text-lg">انضم لأكثر من 10,000 تاجر يستخدمون محلك لأتمتة متاجرهم وزيادة أرباحهم</p>
        
        <div class="flex items-center justify-center gap-8 mt-12">
          <div class="text-center">
            <div class="text-3xl font-bold">+10K</div>
            <div class="text-white/60 text-sm">تاجر نشط</div>
          </div>
          <div class="w-px h-12 bg-white/20"></div>
          <div class="text-center">
            <div class="text-3xl font-bold">99.9%</div>
            <div class="text-white/60 text-sm">وقت التشغيل</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Dark Mode Toggle (Floating) -->
  <button id="dark-mode-toggle" class="fixed top-6 left-6 p-2 rounded-lg bg-card border border-border hover:bg-muted transition-colors shadow-soft" aria-label="Toggle dark mode">
    <i id="sun-icon" data-lucide="sun" class="w-5 h-5" style="display: none;"></i>
    <i id="moon-icon" data-lucide="moon" class="w-5 h-5"></i>
  </button>

  <script src="/main.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
