<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نسيت كلمة المرور | محلك - شي إن</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./styles.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { border: 'hsl(var(--border))', background: 'hsl(var(--background))', foreground: 'hsl(var(--foreground))', primary: { DEFAULT: 'hsl(var(--primary))', foreground: 'hsl(var(--primary-foreground))' }, muted: { DEFAULT: 'hsl(var(--muted))', foreground: 'hsl(var(--muted-foreground))' }, card: { DEFAULT: 'hsl(var(--card))', foreground: 'hsl(var(--card-foreground))' } } } } }</script>
</head>
<body class="min-h-screen bg-gradient-hero flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-card border border-border rounded-2xl p-8 shadow-elevated">
    <a href="./index.html" class="inline-block mb-8"><img src="./assets/logo.png" alt="محلك" class="h-10 mx-auto"></a>
    <div class="text-center mb-8">
      <div class="w-16 h-16 rounded-full bg-primary/10 flex items-center justify-center mx-auto mb-4">
        <i data-lucide="key" class="w-8 h-8 text-primary"></i>
      </div>
      <h1 class="text-2xl font-bold mb-2">نسيت كلمة المرور؟</h1>
      <p class="text-muted-foreground">لا تقلق! أدخل بريدك الإلكتروني وسنرسل لك رابط إعادة التعيين</p>
    </div>
    <form class="space-y-6">
      <div>
        <label class="block text-sm font-medium mb-2">البريد الإلكتروني</label>
        <input type="email" class="w-full px-4 py-3 rounded-xl bg-background border border-border focus:outline-none focus:ring-2 focus:ring-primary/20" placeholder="example@email.com" required>
      </div>
      <button type="submit" class="w-full btn-hero">إرسال رابط الاستعادة</button>
    </form>
    <div class="mt-6 text-center">
      <a href="./login.html" class="text-primary font-medium hover:underline inline-flex items-center gap-2"><i data-lucide="arrow-right" class="w-4 h-4"></i>العودة لتسجيل الدخول</a>
    </div>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>
